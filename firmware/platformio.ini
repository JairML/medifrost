; MediFrost – Firmware del nodo ESP32 (HU01: lectura cada 60 s · HU02: envío HTTPS a Supabase)
; Tareas T02 y T06 – Domenico Chang · Pruebas T03 y T08 – Kheyla Cóndor
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0

; Pruebas unitarias en la computadora (sin placa): pio test -e native
[env:native]
platform = native
test_build_src = no
