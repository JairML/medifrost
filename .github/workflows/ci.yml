# Integración continua (DoD: las pruebas deben pasar en GitHub Actions antes de integrar a develop)
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  firmware:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firmware } }
    steps:
      - uses: actions/checkout@v4
      # Las pruebas del firmware corren cuando ya existe firmware/platformio.ini (paquete 7, HU01)
      - uses: actions/setup-python@v5
        if: hashFiles('firmware/platformio.ini') != ''
        with: { python-version: '3.12' }
      - run: pip install platformio
        if: hashFiles('firmware/platformio.ini') != ''
      - run: pio test -e native
        if: hashFiles('firmware/platformio.ini') != ''
